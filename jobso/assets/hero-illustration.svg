<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title>JOBSO illustration</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8a3d" />
      <stop offset="1" stop-color="#ff6a00" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background rounded rectangle -->
  <rect x="40" y="40" width="720" height="440" rx="22" fill="#fff" stroke="#f3f3f3"/>

  <!-- abstract shapes -->
  <g transform="translate(80,70)">
    <rect x="0" y="0" width="420" height="220" rx="12" fill="url(#g1)" filter="url(#f1)"/>
    <circle cx="380" cy="60" r="46" fill="#fff" opacity="0.12" />

    <!-- job card icons -->
    <g transform="translate(36,28)">
      <rect width="92" height="20" rx="6" fill="#fff" opacity="0.22"/>
      <rect y="36" width="180" height="12" rx="6" fill="#fff" opacity="0.18"/>
      <rect y="56" width="120" height="12" rx="6" fill="#fff" opacity="0.18"/>
    </g>

    <g transform="translate(36,120)">
      <rect width="120" height="18" rx="8" fill="#fff" opacity="0.22"/>
      <rect y="34" width="260" height="10" rx="6" fill="#fff" opacity="0.12"/>
    </g>
  </g>

  <!-- stylized applicant avatars -->
  <g transform="translate(520,120)">
    <circle cx="40" cy="40" r="36" fill="#fff" opacity="0.08"/>
    <circle cx="40" cy="36" r="18" fill="#fff"/>
    <rect x="10" y="64" width="60" height="20" rx="10" fill="#fff" opacity="0.12"/>

    <g transform="translate(0,120)">
      <circle cx="40" cy="40" r="36" fill="#fff" opacity="0.06"/>
      <circle cx="40" cy="36" r="18" fill="#ff6a00"/>
      <rect x="10" y="64" width="60" height="20" rx="10" fill="#fff" opacity="0.08"/>
    </g>
  </g>

</svg>
