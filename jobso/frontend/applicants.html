<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Applicants - JOBSO</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>
      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/saved.html">Saved <span id="savedCount" class="saved-count">0</span></a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a href="/JOBSO/frontend/dashboard.html">Dashboard</a>
        <a href="/JOBSO/frontend/about.html">About</a>
        <a href="/JOBSO/frontend/login.html">Login</a>
        <a href="/JOBSO/frontend/register.html">Register</a>
      </nav>
      <div id="authArea"></div>
    </div>
  </header>
  <main class="container">
    <h2 id="title">Applicants</h2>
    <div id="apps">Loading…</div>
  </main>

  <script type="module">
    import { renderAuth } from './js/auth.js';
    async function load(){
      const qs = new URLSearchParams(location.search);
      const job_id = qs.get('job_id');
      const appsEl = document.getElementById('apps');
      if (!job_id) { appsEl.innerHTML = '<p>Missing job id</p>'; return }
      try{
        // fetch job to show title
        const rj = await fetch('/JOBSO/api/job.php?id='+encodeURIComponent(job_id),{credentials:'same-origin'});
        const jj = rj.headers.get('content-type') && rj.headers.get('content-type').includes('application/json') ? await rj.json() : null;
        if (rj.ok && jj && jj.job) document.getElementById('title').textContent = 'Applicants — ' + (jj.job.title || 'Job');

        const res = await fetch('/JOBSO/api/applications.php?job_id='+encodeURIComponent(job_id),{credentials:'same-origin'});
        const j = res.headers.get('content-type') && res.headers.get('content-type').includes('application/json') ? await res.json() : null;
        if (!res.ok) { appsEl.innerHTML = '<p>' + (j && j.error ? j.error : 'Error') + '</p>'; return }
        const rows = j.applications || [];
        if (!rows.length) { appsEl.innerHTML = '<p>No applications yet.</p>'; return }
        const list = document.createElement('div'); list.className='card';
        for (const a of rows){
          const div = document.createElement('div'); div.style.borderBottom='1px solid #eee'; div.style.padding='12px 0';
          const name = document.createElement('div'); name.innerHTML = '<strong>' + escapeHtml(a.applicant_name || a.applicant_email || 'Applicant') + '</strong> <span style="color:#666">' + escapeHtml(a.applicant_email||'') + '</span>';
          div.appendChild(name);
          if (a.cover_text) {
            const cov = document.createElement('div'); cov.style.marginTop='8px'; cov.textContent = a.cover_text; div.appendChild(cov);
          }
          if (a.resume_path) {
            const r = document.createElement('a'); r.href = '/' + a.resume_path; r.target='_blank'; r.style.display='inline-block'; r.style.marginTop='8px'; r.textContent = 'Download resume'; div.appendChild(r);
          }
          const meta = document.createElement('div'); meta.style.color='#666'; meta.style.marginTop='8px'; meta.textContent = 'Applied at: ' + (a.applied_at || ''); div.appendChild(meta);
          list.appendChild(div);
        }
        appsEl.innerHTML=''; appsEl.appendChild(list);
      }catch(e){ appsEl.innerHTML = '<p>Error loading applications.</p>'; console.error(e) }
    }
    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    renderAuth();
    load();
  </script>
  <script type="module" src="./js/saved-ui.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
