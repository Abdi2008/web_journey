<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Candidate</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a id="dashLink" href="/JOBSO/frontend/dashboard_candidate.html">Dashboard</a>
        <a href="/JOBSO/frontend/about.html">About</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>

  <main class="container">
    <div id="dashboardRoot">Loading…</div>
  </main>

  <script type="module">
    import { renderAuth } from './js/auth.js';
    renderAuth();

    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,"&#39;"); }


    async function renderCandidateDashboard(root, user){
      root.innerHTML = `
        <section class="card dashboard-welcome">
          <h2>Welcome, ${user.name ? escapeHtml(user.name) : escapeHtml(user.email)}</h2>
          <p>Account type: <strong>${escapeHtml(user.role || 'candidate')}</strong></p>
        </section>
        <section class="dashboard-analytics" style="margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;">
          <div class="card analytics-card" id="analytics-summary">
            <h3>My Activity</h3>
            <div class="analytics-stats">
              <div><span class="stat-label">Jobs Applied</span> <span class="stat-value" id="stat-applied">–</span></div>
              <div><span class="stat-label">Jobs Saved</span> <span class="stat-value" id="stat-saved">–</span></div>
              <div><span class="stat-label">Jobs Recommended</span> <span class="stat-value" id="stat-recommended">–</span></div>
            </div>
          </div>
          <div class="card analytics-card" id="analytics-chart">
            <h3>Recent Activity</h3>
            <canvas id="activityChart" width="320" height="120" style="max-width:100%;background:#fff6ee;border-radius:8px"></canvas>
          </div>
          <div class="card analytics-card" id="analytics-recent">
            <h3>Recent Actions</h3>
            <ul id="recentActions" style="margin:0;padding:0;list-style:none;font-size:15px;color:#444"></ul>
          </div>
        </section>
        <section style="margin-top:24px">
          <h3>Recommended Jobs</h3>
          <div id="recommended">Loading…</div>
        </section>
      `;

      // Fetch analytics data
      try {
        // Jobs applied
        const appRes = await fetch('/JOBSO/api/applications.php',{credentials:'same-origin'});
        const appData = await appRes.json();
        document.getElementById('stat-applied').textContent = appData.applications ? appData.applications.length : '0';
        // Jobs saved
        const savedRes = await fetch('/JOBSO/api/save_job.php',{credentials:'same-origin'});
        const savedData = await savedRes.json();
        document.getElementById('stat-saved').textContent = savedData.saved ? savedData.saved.length : '0';
        // Jobs recommended
        const jobsRes = await fetch('/JOBSO/api/jobs.php',{credentials:'same-origin'});
        const jobsData = await jobsRes.json();
        document.getElementById('stat-recommended').textContent = jobsData.jobs ? Math.min(jobsData.jobs.length,12) : '0';

        // Recent actions (applied, saved)
        const recent = [];
        if (appData.applications) {
          for (const a of appData.applications.slice(-5).reverse()) {
            recent.push(`<li>Applied to <strong>${a.job_id}</strong> on ${a.applied_at}</li>`);
          }
        }
        if (savedData.saved) {
          for (const s of savedData.saved.slice(-5).reverse()) {
            recent.push(`<li>Saved <strong>${s.title || s.job_id}</strong> on ${s.saved_at}</li>`);
          }
        }
        document.getElementById('recentActions').innerHTML = recent.length ? recent.join('') : '<li>No recent actions.</li>';

        // Simple activity chart (applied jobs per day)
        if (appData.applications && appData.applications.length) {
          const ctx = document.getElementById('activityChart').getContext('2d');
          // Count applications per day
          const days = {};
          for (const a of appData.applications) {
            const day = a.applied_at ? a.applied_at.slice(0,10) : 'unknown';
            days[day] = (days[day]||0)+1;
          }
          const labels = Object.keys(days).slice(-7);
          const values = labels.map(l=>days[l]);
          // Draw simple bar chart
          ctx.clearRect(0,0,320,120);
          const max = Math.max(...values,1);
          for (let i=0;i<labels.length;i++) {
            const x = 20 + i*40;
            const h = Math.round(80*values[i]/max);
            ctx.fillStyle = '#ff8a3d';
            ctx.fillRect(x,100-h,28,h);
            ctx.fillStyle = '#444';
            ctx.font = '12px Arial';
            ctx.fillText(labels[i].slice(5), x, 115);
            ctx.fillText(values[i], x+8, 95-h);
          }
        }
      } catch(e) { /* ignore analytics errors */ }

      // Recommended jobs (unchanged)
      const rec = document.getElementById('recommended');
      try{
        const res = await fetch('/JOBSO/api/jobs.php',{credentials:'same-origin'});
        const j = await res.json();
        if (!res.ok) { rec.innerText = j.error || 'Error'; return }
        rec.innerHTML = '';
        if (!j.jobs.length) { rec.innerHTML = '<p>No jobs available.</p>'; return }
        const grid = document.createElement('div'); grid.className='jobs-grid';
        for (const job of j.jobs.slice(0,12)){
          const card = document.createElement('div'); card.className='card job-card';
          const title = document.createElement('a'); title.href = `/JOBSO/frontend/view_job.html?id=${job.id}`; title.textContent = job.title; title.className='job-title';
          card.appendChild(title);
          const meta = document.createElement('div'); meta.className='job-meta'; meta.textContent = `${job.company} · ${job.location || ''}`;
          card.appendChild(meta);
          const btn = document.createElement('a'); btn.href = `/JOBSO/frontend/view_job.html?id=${job.id}`; btn.className='button'; btn.style.marginTop='8px'; btn.textContent = 'View & Apply';
          card.appendChild(btn);
          grid.appendChild(card);
        }
        rec.appendChild(grid);
      }catch(e){ rec.innerText = 'Error loading recommendations'; console.error(e) }
    }

    (async function(){
      const root = document.getElementById('dashboardRoot');
      try{
        const res = await fetch('/JOBSO/api/me.php',{credentials:'same-origin'});
        const ct = res.headers.get('content-type') || '';
        let json = null;
        if (ct.includes('application/json')) json = await res.json();
        console.log('/api/me.php ->', res.status, json);
        if (!res.ok) {
          // attempt debug endpoint as well
          try{
            const dbg = await fetch('/JOBSO/api/debug_session.php',{credentials:'same-origin'}).then(r=>r.json());
            console.log('/api/debug_session.php ->', dbg);
            root.innerHTML = '<p>Error fetching user. See console for debug info.</p>';
          }catch(e){
            root.innerText = (json && json.error) ? json.error : 'Error fetching user';
          }
          return;
        }
        const user = json && json.user ? json.user : null;
        if (!user) {
          // show friendly message and diagnostic hint
          root.innerHTML = '<p>Please <a href="/JOBSO/frontend/login.html">login</a> to view your dashboard. If you already logged in, check the console for session diagnostics.</p>';
          try{
            const dbg = await fetch('/JOBSO/api/debug_session.php',{credentials:'same-origin'}).then(r=>r.json());
            console.log('/api/debug_session.php ->', dbg);
          }catch(e){ console.error('debug fetch failed',e) }
          return;
        }
        renderCandidateDashboard(root,user);
      }catch(e){ console.error(e); document.getElementById('dashboardRoot').innerText = 'Error loading dashboard' }
    })();
  </script>
  <script type="module" src="./js/saved-ui.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
