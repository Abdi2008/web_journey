<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Employer</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/saved.html">Saved <span id="savedCount" class="saved-count">0</span></a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a id="dashLink" href="/JOBSO/frontend/dashboard_employer.html">Dashboard</a>
        <a href="/JOBSO/frontend/about.html">About</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>

  <main class="container">
    <div id="dashboardRoot">Loading…</div>
  </main>

  <script type="module">
    import { renderAuth } from './js/auth.js';
    renderAuth();

    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,"&#39;"); }

    async function renderEmployerDashboard(root, user){
      root.innerHTML = `
        <section class="card dashboard-welcome">
          <h2>Welcome, ${user.company ? escapeHtml(user.company) : escapeHtml(user.name || user.email)}</h2>
          <p>Account type: <strong>${escapeHtml(user.role || 'employer')}</strong></p>
        </section>
        <section class="dashboard-analytics" style="margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;">
          <div class="card analytics-card" id="analytics-summary">
            <h3>My Jobs</h3>
            <div class="analytics-stats">
              <div><span class="stat-label">Jobs Posted</span> <span class="stat-value" id="stat-posted">–</span></div>
              <div><span class="stat-label">Active Jobs</span> <span class="stat-value" id="stat-active">–</span></div>
              <div><span class="stat-label">Total Applicants</span> <span class="stat-value" id="stat-applicants">–</span></div>
            </div>
          </div>
          <div class="card analytics-card" id="analytics-chart">
            <h3>Applications Over Time</h3>
            <canvas id="activityChart" width="320" height="120" style="max-width:100%;background:#fff6ee;border-radius:8px"></canvas>
          </div>
          <div class="card analytics-card" id="analytics-recent">
            <h3>Recent Jobs</h3>
            <ul id="recentJobs" style="margin:0;padding:0;list-style:none;font-size:15px;color:#444"></ul>
          </div>
        </section>
        <section style="margin-top:24px">
          <h3>Your Jobs</h3>
          <div id="jobs">Loading…</div>
        </section>
      `;

      // Fetch jobs and analytics
      const c = document.getElementById('jobs');
      try{
        const res = await fetch('/JOBSO/api/jobs.php?mine=1',{credentials:'same-origin'});
        const j = await res.json();
        if (!res.ok) { c.innerText = j.error || 'Error'; return }
        c.innerHTML = '';
        if (!j.jobs.length) { c.innerHTML = '<p>No jobs posted yet.</p>'; return }
        // Analytics summary
        document.getElementById('stat-posted').textContent = j.jobs.length;
        document.getElementById('stat-active').textContent = j.jobs.filter(job=>job.is_active==1).length;

        // Applicants analytics
        let totalApplicants = 0;
        const jobApplicants = {};
        // For chart: applications per day
        const dayCounts = {};
        // For recent jobs
        const recentJobs = [];

        // Fetch applicants for each job
        await Promise.all(j.jobs.map(async job => {
          try {
            const r = await fetch(`/JOBSO/api/applications.php?job_id=${encodeURIComponent(job.id)}`,{credentials:'same-origin'});
            const ct = r.headers.get('content-type') || '';
            const data = ct.includes('application/json') ? await r.json() : null;
            if (r.ok && data && Array.isArray(data.applications)){
              jobApplicants[job.id] = data.applications.length;
              totalApplicants += data.applications.length;
              // Count applications per day
              for (const a of data.applications) {
                const day = a.applied_at ? a.applied_at.slice(0,10) : 'unknown';
                dayCounts[day] = (dayCounts[day]||0)+1;
              }
            }
          }catch(e){ /* ignore */ }
        }));
        document.getElementById('stat-applicants').textContent = totalApplicants;

        // Recent jobs (last 5)
        for (const job of j.jobs.slice(-5).reverse()) {
          recentJobs.push(`<li><a href="/JOBSO/frontend/view_job.html?id=${job.id}" class="job-title">${escapeHtml(job.title)}</a> <span style="color:#ff8a3d;font-size:13px">${jobApplicants[job.id]||0} applicants</span></li>`);
        }
        document.getElementById('recentJobs').innerHTML = recentJobs.length ? recentJobs.join('') : '<li>No recent jobs.</li>';

        // Simple activity chart (applications per day)
        const ctx = document.getElementById('activityChart').getContext('2d');
        const labels = Object.keys(dayCounts).slice(-7);
        const values = labels.map(l=>dayCounts[l]);
        ctx.clearRect(0,0,320,120);
        const max = Math.max(...values,1);
        for (let i=0;i<labels.length;i++) {
          const x = 20 + i*40;
          const h = Math.round(80*values[i]/max);
          ctx.fillStyle = '#ff8a3d';
          ctx.fillRect(x,100-h,28,h);
          ctx.fillStyle = '#444';
          ctx.font = '12px Arial';
          ctx.fillText(labels[i].slice(5), x, 115);
          ctx.fillText(values[i], x+8, 95-h);
        }

        // Jobs list (unchanged)
        const ul = document.createElement('ul'); ul.className='job-list';
        for (const job of j.jobs){
          const li = document.createElement('li');
          const a = document.createElement('a'); a.href = `/JOBSO/frontend/view_job.html?id=${job.id}`; a.textContent = job.title; a.className='job-title';
          li.appendChild(a);
          const meta = document.createElement('div'); meta.className='job-meta'; meta.textContent = `${job.company} · ${job.location || ''} · ${job.is_active==1? 'Active':'Closed'}`;
          li.appendChild(meta);
          const actions = document.createElement('div');
          const edit = document.createElement('a'); edit.href = `/JOBSO/frontend/edit_job.html?id=${job.id}`; edit.textContent = 'Edit'; edit.style.marginRight='8px';
          actions.appendChild(edit);
          const appsBtn = document.createElement('a'); appsBtn.href = `/JOBSO/frontend/applicants.html?job_id=${job.id}`; appsBtn.textContent = `Applicants (${jobApplicants[job.id]||0})`; appsBtn.style.marginRight='8px'; appsBtn.className='button mini';
          actions.appendChild(appsBtn);
          const toggle = document.createElement('button'); toggle.textContent = job.is_active==1 ? 'Close' : 'Reopen';
          toggle.addEventListener('click', async ()=>{
            const newState = job.is_active==1 ? 0 : 1;
            const r = await fetch('/JOBSO/api/job_update.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:job.id,is_active:newState})});
            const rr = await r.json();
            if (r.ok) renderEmployerDashboard(root, user); else alert(rr.error||'Failed');
          });
          actions.appendChild(toggle);
          const del = document.createElement('button'); del.textContent='Delete'; del.style.marginLeft='8px';
          del.addEventListener('click', async ()=>{
            if (!confirm('Delete?')) return;
            const r = await fetch(`/JOBSO/api/jobs.php?id=${job.id}`,{method:'DELETE',credentials:'same-origin'});
            const rr = await r.json();
            if (r.ok) renderEmployerDashboard(root, user); else alert(rr.error||'Failed');
          });
          actions.appendChild(del);
          li.appendChild(actions);
          ul.appendChild(li);
        }
        c.appendChild(ul);
      }catch(e){ c.innerText = 'Error'; console.error(e) }
    }

    (async function(){
      const root = document.getElementById('dashboardRoot');
      try{
        const res = await fetch('/JOBSO/api/me.php',{credentials:'same-origin'});
        const ct = res.headers.get('content-type') || '';
        let json = null;
        if (ct.includes('application/json')) json = await res.json();
        console.log('/api/me.php ->', res.status, json);
        if (!res.ok) {
          try{
            const dbg = await fetch('/JOBSO/api/debug_session.php',{credentials:'same-origin'}).then(r=>r.json());
            console.log('/api/debug_session.php ->', dbg);
            root.innerHTML = '<p>Error fetching user. See console for debug info.</p>';
          }catch(e){
            root.innerText = (json && json.error) ? json.error : 'Error fetching user';
          }
          return;
        }
        const user = json && json.user ? json.user : null;
        if (!user) {
          root.innerHTML = '<p>Please <a href="/JOBSO/frontend/login.html">login</a> to view your dashboard. If you already logged in, check the console for session diagnostics.</p>';
          try{
            const dbg = await fetch('/JOBSO/api/debug_session.php',{credentials:'same-origin'}).then(r=>r.json());
            console.log('/api/debug_session.php ->', dbg);
          }catch(e){ console.error('debug fetch failed',e) }
          return;
        }
        renderEmployerDashboard(root, user);
      }catch(e){ console.error(e); document.getElementById('dashboardRoot').innerText = 'Error loading dashboard' }
    })();
  </script>
  <script type="module" src="./js/saved-ui.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
