<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit Job - JOBSO</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a href="/JOBSO/frontend/dashboard.html">Dashboard</a>
        <a href="/JOBSO/frontend/about.html">About</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>
  <main class="container auth">
    <h2>Edit Job</h2>
    <form id="editForm" enctype="multipart/form-data">
      <input type="hidden" name="id" id="jobId">
      <label>Title<br><input name="title" id="title" required></label>
      <label>Company<br><input name="company" id="company" required></label>
      <label>Company logo (optional)<br><input name="company_logo" type="file" accept="image/*"></label>
      <label>Location<br><input name="location" id="location"></label>
      <label>Description<br><textarea name="description" id="description" rows="8" required></textarea></label>
      <label><input type="checkbox" name="is_active" id="is_active"> Active</label>
      <button type="submit">Save</button>
    </form>
    <div id="msg"></div>
  </main>
  <script type="module">
    import { submitForm } from './js/app.js';
    const qs = new URLSearchParams(location.search);
    const id = qs.get('id');
    const form = document.getElementById('editForm');
    const msg = document.getElementById('msg');
    async function load(){
      if (!id) { msg.textContent='Missing id'; return }
      try{
        const res = await fetch(`/JOBSO/api/job.php?id=${id}`,{credentials:'same-origin'});
        const j = await res.json();
        if (!res.ok) { msg.textContent = j.error || 'Error'; return }
        const job = j.job;
        document.getElementById('jobId').value = job.id;
        document.getElementById('title').value = job.title;
        document.getElementById('company').value = job.company;
        document.getElementById('location').value = job.location || '';
        document.getElementById('description').value = job.description || '';
        document.getElementById('is_active').checked = job.is_active==1;
      }catch(e){ msg.textContent='Error loading job' }
    }
    form.addEventListener('submit', async e=>{
      e.preventDefault(); msg.textContent='Saving…';
      try{
        const res = await submitForm(form,'/job_update.php');
        msg.textContent = 'Saved.'; setTimeout(()=>location='/JOBSO/frontend/dashboard.html',800);
      }catch(err){ msg.textContent = err.error || 'Save failed'; }
    });
    load();
  </script>
  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/saved-ui.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
