<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JOBSO - Jobs</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a href="/JOBSO/frontend/dashboard.html">Dashboard</a>
        <a href="/JOBSO/frontend/about.html">About</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>

  <main>
    <section class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <h2>All Jobs</h2>
        <div>
          <a class="button" href="/JOBSO/frontend/post_job.html">Post a job</a>
        </div>
      </div>

      <div style="margin-top:18px;display:flex;gap:18px;align-items:flex-start">
        <div style="flex:3">
          <div id="jobsList" class="jobs-grid">Loading…</div>
        </div>
        <aside style="flex:1">
          <div class="card">
            <h3>Filter</h3>
            <p style="margin:8px 0 0 0;color:#666">(Demo) Use search on the top-right to find jobs.</p>
          </div>
        </aside>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container">
        <div>© JOBSO — Simple Job Portal</div>
        <div><a href="#">About</a> · <a href="#">Privacy</a> · <a href="#">Contact</a></div>
      </div>
    </footer>
  </main>

  <script type="module">
    import { loadJobs } from './js/app.js';
    // load all jobs into jobsList
    loadJobs(document.getElementById('jobsList'));
  </script>
  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/saved-ui.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
