<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post Job - JOBSO</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/saved.html">Saved <span id="savedCount" class="saved-count">0</span></a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a href="/JOBSO/frontend/dashboard.html">Dashboard</a>
        <a href="/JOBSO/frontend/login.html">Login</a>
        <a href="/JOBSO/frontend/register.html">Register</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>
  <main class="container auth">
    <h2>Post a Job</h2>
    <form id="postForm" enctype="multipart/form-data">
      <label>Title<br><input name="title" required></label>
      <label>Company<br><input name="company" required></label>
      <label>Company logo (optional)<br><input name="company_logo" type="file" accept="image/*"></label>
      <label>Location<br><input name="location"></label>
      <label>Description<br><textarea name="description" rows="8" required></textarea></label>
      <button type="submit">Post Job</button>
    </form>
    <div id="msg"></div>
  </main>
  <script type="module">
    import { submitForm } from './js/app.js';
    const form = document.getElementById('postForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async e=>{
      e.preventDefault(); msg.textContent='Posting…';
      try{
        const res = await submitForm(form,'/jobs.php');
        msg.textContent = 'Posted. Redirecting…';
        window.location = '/JOBSO/frontend/index.html';
      }catch(err){
        msg.textContent = err.error || 'Post failed';
      }
    });
  </script>
  <script type="module" src="./js/auth.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
