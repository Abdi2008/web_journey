<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - JOBSO</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/saved.html">Saved <span id="savedCount" class="saved-count">0</span></a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a href="/JOBSO/frontend/dashboard.html">Dashboard</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>
  <main class="container auth">
    <h2>Create account</h2>
    <form id="registerForm">
      <label>Name<br><input name="name" required></label>
      <label>Email<br><input name="email" type="email" required></label>
      <label>Password<br><input name="password" type="password" required></label>
      <label>Account type<br>
        <select name="role">
          <option value="candidate">Job Seeker</option>
          <option value="employer">Employer</option>
        </select>
      </label>
      <button type="submit">Register</button>
    </form>
    <div id="msg"></div>
  </main>
  <script type="module">
    import { submitForm } from './js/app.js';
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    import { renderAuth } from './js/auth.js';
    form.addEventListener('submit', async e=>{
      e.preventDefault(); msg.textContent='Submitting…';
      try{
        const res = await submitForm(form,'/register.php');
        // after register (session set), fetch /api/me.php to get role and update UI
        try{
          const meRes = await fetch('/JOBSO/api/me.php',{credentials:'same-origin'});
          const ct = meRes.headers.get('content-type') || '';
          const json = ct.includes('application/json') ? await meRes.json() : null;
          renderAuth();
          // redirect to role-specific dashboard after registration
          const role = json && json.user && json.user.role ? json.user.role : 'candidate';
          if (role === 'admin') {
            window.location = '/JOBSO/frontend/admin.html';
          } else if (role === 'employer') {
            window.location = '/JOBSO/frontend/dashboard_employer.html';
          } else {
            window.location = '/JOBSO/frontend/dashboard_candidate.html';
          }
        }catch(e){
          console.error('Failed to fetch /api/me.php after register', e);
          window.location = '/JOBSO/frontend/index.html';
        }
      }catch(err){
        msg.textContent = err.error || 'Registration failed';
      }
    });
  </script>
  <script type="module" src="./js/auth.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
