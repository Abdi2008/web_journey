<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job - JOBSO</title>
  <link rel="stylesheet" href="/JOBSO/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <h1><a class="logo" href="/JOBSO/frontend/index.html"><img class="logo" src="/JOBSO/assets/logo.png" alt="JOBSO logo"></a></h1>

      <button id="navToggle" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav" class="main-nav">
        <a href="/JOBSO/frontend/index.html">Home</a>
        <a href="/JOBSO/frontend/jobs.html">Jobs</a>
        <a href="/JOBSO/frontend/saved.html">Saved <span id="savedCount" class="saved-count">0</span></a>
        <a href="/JOBSO/frontend/post_job.html">Post Job</a>
        <a href="/JOBSO/frontend/dashboard.html">Dashboard</a>
        <a href="/JOBSO/frontend/login.html">Login</a>
        <a href="/JOBSO/frontend/register.html">Register</a>
      </nav>

      <div id="authArea"></div>
    </div>
  </header>
  <main class="container">
    <div id="job">Loading…</div>
    <p><a href="/JOBSO/frontend/index.html">Back to list</a></p>
  </main>
  <script type="module">
    // very small inline helper
    async function load(){
      const qs = new URLSearchParams(location.search);
      const id = qs.get('id');
      if (!id) { document.getElementById('job').innerText = 'Missing id'; return }
      try{
        const res = await fetch(`/JOBSO/api/job.php?id=${id}`, {credentials:'same-origin'});
        const j = await res.json();
        if (!res.ok) { document.getElementById('job').innerText = j.error || 'Error'; return }
        const job = j.job;
        const c = document.getElementById('job');
        const logoHtml = job.company_logo ? `<img src='/${job.company_logo.replace(/^\/*/,'')}' class='logo-img' alt='logo' style='margin-bottom:8px'>` : '';
        c.innerHTML = `${logoHtml}<h2>${job.title}</h2><div class='job-meta'>${job.company} · ${job.location || ''} · posted by ${job.poster}</div><section class='job-desc'>${job.description.replace(/\n/g,'<br>')}</section>`;
        // Attempt to render an Apply form for candidates
        try{
          const meRes = await fetch('/JOBSO/api/me.php',{credentials:'same-origin'});
          const ct = meRes.headers.get('content-type')||'';
          let me = null;
          if (ct.includes('application/json')) me = await meRes.json();
          const user = me && me.user ? me.user : null;
          if (user && user.role === 'candidate' && job.is_active==1) {
            const formHtml = `
              <section style="margin-top:16px" class='card'>
                <h3>Apply for this job</h3>
                <form id="applyForm" enctype="multipart/form-data">
                  <input type="hidden" name="job_id" value="${job.id}">
                  <label>Cover message (optional)<br><textarea name="cover_text" rows="4" placeholder="A short note to the employer"></textarea></label>
                  <label>Upload resume (pdf/doc/docx)<br><input type="file" name="resume" accept=".pdf,.doc,.docx"></label>
                  <div style="margin-top:8px"><button type="submit">Submit Application</button></div>
                </form>
                <div id="applyMsg" style="margin-top:8px"></div>
              </section>`;
            c.insertAdjacentHTML('beforeend', formHtml);
            const applyForm = document.getElementById('applyForm');
            applyForm.addEventListener('submit', async (ev)=>{
              ev.preventDefault();
              const msg = document.getElementById('applyMsg');
              msg.textContent = 'Submitting…';
              const fd = new FormData(applyForm);
              try{
                // use helper to submit the FormData
                const module = await import('./js/jobs-actions.js');
                await module.applyJob(fd);
                msg.textContent = 'Application submitted. Thank you!'; msg.style.color='green';
                applyForm.reset();
              }catch(e){ console.error(e); msg.textContent = (e && e.error) ? e.error : 'Network error'; msg.style.color='crimson' }
            });
          }
        }catch(e){ console.warn('Could not determine user for apply form', e) }
      }catch(e){ document.getElementById('job').innerText = 'Error loading job' }
    }
    load();
  </script>
  <script type="module" src="./js/auth.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
