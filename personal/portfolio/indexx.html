<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudTier</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>
    <h1>Simple, Transparent Pricing</h1>
    <section id ="cards">
    <div class="container">
        <div class=" card basic">
            <h3>BASIC</h3>
            <ul>
                <h5>$19.99</h5>
                <li>500GB</li>
                <li>2 Users</li>
                <li>Email</li>
            </ul>
            <button class="btn">PURCHASE</button>
        </div>
         <div class=" card professional">
            <h3>PROFESSIONAL</h3>
            <h4>(Highlighted)</h4>
            <ul>
                <h5>$24.99</h5>
                <li>1TB</li>
                <li>5 Users</li>
                <li>Email + Chat</li>
            </ul>
            <button class="btn">PURCHASE</button>
        </div>
         <div class=" card master">
            <h3>MASTER</h3>
            <ul>
                <h5>$39.99</h5>
                <li>2TB</li>
                <li>10 Users</li>
                <li>24/7 Sup</li>
            </ul>
            <button class="btn">PURCHASE</button>
        </div>
    </div>
    </section>
</body>
</html>
